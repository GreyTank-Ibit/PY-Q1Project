<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q1 Project</title>

<link rel="stylesheet"
      href="https://pyscript.net/releases/2025.3.1/core.css">
<script type="module"
        src="https://pyscript.net/releases/2025.3.1/core.js">
</script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #000000;
    color: #000000;
}

nav {
    height: 32px;
    background-color: #000000;
    color: #ffffff;
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-size: 11px;
}

nav .logo {
    font-weight: bold;
    margin-right: auto;
}

nav a {
    color: #ffffff;
    text-decoration: none;
    margin-left: 15px;
}

main {
    display: flex;
    justify-content: center;
    padding: 28px 15px;
}

.card {
    background-color: #ffffff;
    width: 368px;
    border: 2px solid #000000;
    border-radius: 0;
    overflow: hidden;
}

.card-header {
    background-color: #000000;
    color: #ffffff;
    text-align: center;
    padding: 15px;
}

.card-header .icon {
    font-size: 20px;
}

.card-header h1 {
    font-size: 17px;
    margin: 4px 0;
}

.card-header p {
    font-size: 7px;
    margin: 0;
}

.content {
    padding: 13px;
}

label {
    display: block;
    font-size: 9px;
    font-weight: bold;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 7px;
    border: 1px solid #000000;
    border-radius: 0;
    margin-bottom: 9px;
    font-size: 9px;
}

button {
    width: 100%;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 8px;
    background-color: #000000;
    color: #ffffff;
    font-weight: bold;
    cursor: pointer;
    margin-top: 2px;
}

button:hover {
    background-color: #ffffff;
    color: #000000;
}

hr {
    border: none;
    border-top: 1px solid #000000;
    margin: 12px 0;
}

#output {
    text-align: center;
    font-size: 10px;
    font-weight: bold;
    color: #000000;
    min-height: 18px;
}

footer {
    background-color: #000000;
    color: #ffffff;
    text-align: center;
    padding: 10px;
    font-size: 9px;
}
</style>
</head>

<body>

<nav>
    <div class="logo">Skewer</div>
    <a href="sku.html">▥ SKU Generator</a>
    <a href="index.html">● Receipt Generator</a>
</nav>

<main>
<div class="card">

    <div class="card-header">
        <div class="icon">▥</div>
        <h1>SKU Generator</h1>
        <p>Stock Keeping Unit Generator</p>
    </div>

    <div class="content">

        <label for="category">🏷 Category</label>

        <input
            type="text"
            id="category"
            placeholder="Enter Category"
        >

        <label for="product">▣ Product Name</label>

        <input
            type="text"
            id="product"
            placeholder="e.g. Bottled Water"
        >

        <label for="stock">▤ Stock Quantity</label>

        <input
            type="number"
            id="stock"
            placeholder="e.g. 50"
            min="0"
        >

        <button
            type="button"
            py-click="generate_sku"
        >
            Generate SKU
        </button>

        <hr>

        <div id="output">
            Your generated SKU will appear here.
        </div>

    </div>
</div>
</main>

<footer>
     SKU Generator — 1st Quarter Project
</footer>

<script type="py" src="main.py"></script>

</body>
</html>
